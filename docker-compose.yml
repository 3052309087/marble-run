name: marble-run

services:
  postgres:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: marble_game
      POSTGRES_USER: marble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env using scripts/setup-docker.ps1 first}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marble -d marble_game"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - marble_pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  api:
    image: marble-run-api:local
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: marble_game
      PGUSER: marble
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create .env first}
      JWT_SECRET: ${JWT_SECRET:?Create .env using scripts/setup-docker.ps1 first}
      CLIENT_ORIGIN: http://localhost:${WEB_PORT:-5173}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: marble-run-web:local
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  marble_pgdata:
